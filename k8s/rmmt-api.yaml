apiVersion: apps/v1
kind: Deployment
metadata:
  name: rmmt-api
  namespace: rmmt
  labels:
    app: rmmt-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rmmt-api
  template:
    metadata:
      labels:
        app: rmmt-api
    spec:
      containers:
      - name: rmmt-api
        image: rmmt-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: rmmt-config
              key: NODE_ENV
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: rmmt-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: rmmt-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: rmmt-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: rmmt-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: rmmt-config
              key: DB_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: rmmt-secrets
              key: JWT_SECRET
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: rmmt-api
  namespace: rmmt
  labels:
    app: rmmt-api
spec:
  selector:
    app: rmmt-api
  ports:
  - name: http
    port: 80
    targetPort: 5000
    protocol: TCP
  - name: https
    port: 443
    targetPort: 5000
    protocol: TCP
  type: ClusterIP